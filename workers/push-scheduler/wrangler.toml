name = "thanzi-push-scheduler"
main = "worker.js"
compatibility_date = "2024-09-23"

# Runs every 5 minutes. If you change this, also update CRON_WINDOW_MIN
# at the top of worker.js to match.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (NOT vars — set these with `wrangler secret put <NAME>` so they're
# encrypted and never appear in this file or in git):
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT
#   APPWRITE_ENDPOINT
#   APPWRITE_PROJECT_ID
#   APPWRITE_API_KEY
#   APPWRITE_DATABASE_ID
#   WEBHOOK_USER         username for the Goal Reached Appwrite Webhook's
#   WEBHOOK_PASSWORD     "HTTP authentication" fields — set the exact same
#                        values in the Appwrite console when creating the
#                        webhook. See README.md.
