name = "thanzi-push-scheduler"
main = "worker.js"
compatibility_date = "2024-09-23"

# Runs every 5 minutes. If you change this, also update CRON_WINDOW_MIN
# at the top of worker.js to match.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (NOT vars — set these with `wrangler secret put <NAME>` so they're
# encrypted and never appear in this file or in git):
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT
#   APPWRITE_ENDPOINT
#   APPWRITE_PROJECT_ID
#   APPWRITE_API_KEY
#   APPWRITE_DATABASE_ID
#   WEBHOOK_SECRET       shared secret for the Goal Reached Appwrite Webhook —
#                        set the same value as a custom header (X-Webhook-Secret)
#                        on the webhook in the Appwrite console. See README.md.
